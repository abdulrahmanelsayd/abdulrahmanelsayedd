name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://abdulrahmanelsayed.xyz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run audit:dependencies
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check production routes, journeys and gallery gestures
        shell: bash
        run: |
          npm start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/portfolio-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/portfolio-server.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/
          npm run test:release -- --project=desktop --project=mobile
          npx playwright test --project=regression tests/e2e/tr03.spec.ts tests/e2e/tr03-c01.spec.ts
          npx playwright test --project=regression tests/e2e/shared-ui.spec.ts tests/e2e/navigation-portrait.spec.ts
          npm run test:gallery
